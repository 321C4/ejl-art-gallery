<!DOCTYPE html>
<!--The head tag encloses links to any scripts you are using, scene title, and metadata such as favicon-->
   <head>
    <meta charset="utf-8">
        <style>
      html, body { background: #000; }
      a-scene { transition: 1s opacity ease-in-out, 1s visibility ease-in-out; }
      a-scene:not([data-is-loaded="true"]) { opacity: 0; pointer-events: none; transition: none; visibility: visible; }
      a-scene[data-is-loaded="true"] { opacity: 1; pointer-events: auto; visibility: visible; }
    </style>
<!-- link traversal stuff, with thanks to cvan and caseyyee -->
   <script src="sw-load.js" data-service-worker="sw.js" data-service-worker-scope="./"></script>
    <link rel="prefetch" href="index.html">


     <title>Baskets</title>
    <script src="js/aframe.min.js"></script>
    <script src="js/aframe-bmfont-text-component.min.js"></script>
    <script src="js/aframe-hyperlink.js"></script>
    <link rel="icon" sizes="192x192" href="img/si-icon.png">
   </head>
  <body>
    <a-scene>

<!--..................
ASSETS for gallery
...................-->
    <a-assets>
    	<!--gallery model-->
    	<a-asset-item id="galleries" src="models/ejl-octagon.gallery.glb"></a-asset-item>

    	<!--art image example syntax-->
    	<img id="art-1" src="img/old-art-pieces/2007knit-vhs.png">

    	<!-- return home link image -->
    	<img id="placeholder-icon" src="img/si-icon.png">


    </a-assets>

<!--SKY & CAMERA-->
  	<a-sky color="#425D70"></a-sky>
    <a-entity position="0 0 -3" rotation="0 0 0">
        <a-camera id="camera" look-controls wasd-controls>
          <a-ring cursor="fuse:false" raycaster="objects: .collidable; far: 4.5; near: 1; interval: 1000" class="reticle-cursor" opacity="0.5" color="#E812CE"  radius-outer="0.01" radius-inner="0.008" position="0 0 -1">
          </a-ring>
        </a-camera>
    </a-entity>


<!--LIGHTS-->
<!--<a-entity light="type: point; intensity: 1.5; distance: 35; decay: 2" position="0 15 -3"></a-entity>-->
<a-entity light="type: ambient; color: #CCC; intensity: 0.5"></a-entity>


<!--...................................
HALL OF --
...................................-->

<!--Gallery Model
<a-gltf-model src="#galleries" scale="2 2 2" position="0 0 0" rotation="0 0 0"></a-gltf-model>
-->

<!--artist statement-->
<a-entity bmfont-text="text: Artist Statement lorem ipsum etc etc; align: center; color: #ffffff; width: 320;" position="0 0.5 -3" scale="1 1 1" rotation="-90 0 0"></a-entity>


<!--image of art piece example-->
<a-entity class="rotate-art" position="0 0 -3.5" rotation="0 0 0">
	<a-image src="#art-1" width="1" height="1" position="0 1.5 -4"></a-image>
	<a-entity bmfont-text="text: Soft VHS Plants vaccuformed plastic, VHS tape, 2007; align: center; color: #ffffff; width: 320;" position="-0.4 0.6 -2" scale="0.5 0.5 0.5"></a-entity>
</a-entity>


<!--Traversable link to home page-->
<a-entity class="collidable" position="0 0 -1" rotation="0 0 0">
	<a-entity bmfont-text="text: Return Home; align: center; color: #ffffff; width: 320;" position="0 2 -4" rotation="0 0 0" scale="0.5 0.5 0.5"></a-entity>
	<a-box href="index.html" material="src: #placeholder-icon" depth="0.2" height="2" width="2" position="0 1 -6"></a-box>
</a-entity>


    </a-scene>
  </body>
</html>

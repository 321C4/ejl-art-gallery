      html, body { background: #000; }

      a-scene:not([data-is-loaded="true"]) { opacity: 0; pointer-events: none; transition: none; visibility: visible; }

  	<a-sky color="#425D70"></a-sky>

    <a-entity position="0 0 -3" rotation="0 0 0">
        <a-camera id="camera" look-controls wasd-controls>
          <a-ring cursor="fuse:false" raycaster="objects: .collidable; far: 4.5; near: 1; interval: 1000" class="reticle-cursor" opacity="0" color="#E812CE"  radius-outer="0.01" radius-inner="0.008" position="0 0 -1">
          </a-ring>
        </a-camera>
    </a-entity>

<a-entity light="type: ambient; color: #CCC; intensity: 0.2"></a-entity>

<!--GROUND PLANE-->
<a-plane color="#276B46" height="100" width="100" rotation="-90 0 0" position="0 -0.6 0"></a-plane>
